<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Email</title>
	<style type="text/css">
		body {
			background-color: #fffcfc;
			margin: 0;
		}

		table {
			border-collapse: collapse;
			border-spacing: 0;
			background-color: #ffe48c;
			width: 100%;
			max-width: 600px;
		}
		article {
			display: block;
			clear: both;
			background-color: #fdecc2;
			width: 100%;
			max-width: 600px;
			min-height: 900px;
			margin: 0 auto;
			box-sizing: border-box;
			padding: 20px;
			border-bottom: 2px solid #c78374;
		}
		td {
			padding: 10px;
		}

		img {
			border: 0;
		}

		.wrapper {
			width: 100%;
			table-layout: fixed;
			padding-bottom: 50px;
		}

		.main {
			width: 100%;
			max-width: 600px;
		}
		p {
			font-family: Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			color: #92680d;
			text-align: center;
		}
		article p {
			
			font-family: Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			color: #b2614e;
			text-align: center;
			
		}
		h1 {
			font-family: Arial, sans-serif;
		
			line-height: 1.5;
			color: #92680d;
			text-align: center;
		}
 h3 {
			font-family: Arial, sans-serif;
			font-size: 20px;
			line-height: 1.5;
			color: #a85e4d;
			text-align: center;
		}

		.divider {
			display: block;
			clear: both;
			width: 80%;
			max-width: 520px;
			height: 1px;
			background-color: #b06117;
			border: 0;
			margin: 20px auto 0;
			padding: 0;
			line-height: 0;
			font-size: 0;
		}
.left-text {
			font-family: Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			color: #69302c;
			text-align: left;
			display: block;
			margin: 20px 0 0 70px;
		}
	</style>
</head>

<body>
	<center class="wrapper">
	<table class="main" width="100%">
	<tr>
	<td>
	<h1>Hello!</h1>
	<p>Pasta for life</p>
	</td>
	</tr>
		</table>
		<article>
	<h3>Welcome to the home of the Pastas! </h3> <p>The pasta you want is granted.</p>

		<hr class="divider" /> 
		<br>
		<p class="left-text">w</p>
	</article>
	

	</center>
</body>
</html>
