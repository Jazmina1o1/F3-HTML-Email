<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Email</title>
	<style type="text/css">
		body {
			background-color: #fffcfc;
			margin: 0;
		}

		table {
			border-collapse: separate;
      border-spacing: 0px;
	  background-color: #fae480;
		}
	article {
		background-color: #ffefbb;
		width: 57%;
		height: 700px;
		position: relative;
		top: -20px;
	}
		td {
			padding: 10px;
		}

		img {
			border: 0;
		}

		.wrapper {
			width: 100%;
			table-layout: fixed;
			padding-bottom: 50px;
		}

		.main {
			width: 100%;
			max-width: 600px;
		}
		p {
			font-family: Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			color: #92680d;
			text-align: center;
		}
		h1 {
			font-family: Arial, sans-serif;
		
			line-height: 1.5;
			color: #92680d;
			text-align: center;
		}

	</style>
</head>

<body>
	<center class="wrapper">
	<table class="main" width="100%">
	<tr>
	<td>
	<h1>Hello!</h1>
	<p>Pasta for life</p>
	</td>
	</tr>
		</table>
		<article>
	<BR> <p>QUOTE/SMTH</p>
</article>

	</center>
</body>
</html>
